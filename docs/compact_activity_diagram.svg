<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="660" viewBox="0 0 1260 660">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F8FAFC"/>

  <!-- SWIMLANE / PHASE DIVIDERS -->
  <line x1="390" y1="20" x2="390" y2="640" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="810" y1="20" x2="810" y2="640" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- PHASE HEADERS -->
  <text x="215" y="28" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#64748B" text-anchor="middle" letter-spacing="1">1. TEMPORAL &amp; CALENDAR VALIDATION</text>
  <text x="600" y="28" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#64748B" text-anchor="middle" letter-spacing="1">2. CANDIDATE MATCHING &amp; DISPATCH</text>
  <text x="1030" y="28" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#64748B" text-anchor="middle" letter-spacing="1">3. RESOLUTION &amp; TIMELINE UPDATE</text>

  <!-- ==================== COLUMN 1: VALIDATION ==================== -->
  
  <!-- Start Node -->
  <g transform="translate(65, 45)" filter="url(#shadow)">
    <rect width="300" height="42" rx="21" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.8"/>
    <text x="150" y="26" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#312E81" text-anchor="middle">Start: Faculty Initiates Request</text>
  </g>

  <!-- Decision 1: Today? -->
  <g transform="translate(115, 120)">
    <polygon points="100,0 200,35 100,70 0,35" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="100" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E1B4B" text-anchor="middle">Is lecture scheduled</text>
    <text x="100" y="46" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E1B4B" text-anchor="middle">today?</text>
  </g>

  <!-- Abort 1 (Not today) -->
  <g transform="translate(45, 225)" filter="url(#shadow)">
    <rect width="180" height="50" rx="6" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.2"/>
    <text x="90" y="22" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9F1239" text-anchor="middle">Abort Request:</text>
    <text x="90" y="37" font-family="Arial, sans-serif" font-size="10" fill="#BE123C" text-anchor="middle">Only allowed on lecture date</text>
  </g>

  <!-- Decision 2: Started? -->
  <g transform="translate(195, 220)">
    <polygon points="90,0 180,35 90,70 0,35" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="90" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E1B4B" text-anchor="middle">Current time &lt;</text>
    <text x="90" y="46" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E1B4B" text-anchor="middle">Lecture start?</text>
  </g>

  <!-- Abort 2 (Elapsed) -->
  <g transform="translate(100, 335)" filter="url(#shadow)">
    <rect width="180" height="50" rx="6" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.2"/>
    <text x="90" y="22" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9F1239" text-anchor="middle">Abort Request:</text>
    <text x="90" y="37" font-family="Arial, sans-serif" font-size="10" fill="#BE123C" text-anchor="middle">Lecture has commenced/elapsed</text>
  </g>

  <!-- End: Blocked Capsule -->
  <g transform="translate(65, 435)" filter="url(#shadow)">
    <rect width="210" height="38" rx="19" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
    <text x="105" y="24" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#991B1B" text-anchor="middle">End: Request Blocked</text>
  </g>

  <!-- Validation Arrows -->
  <line x1="215" y1="87" x2="215" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision 1 branches -->
  <path d="M 115,155 L 75,155 L 75,225" fill="none" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DC2626">No</text>

  <path d="M 285,190 L 285,220" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="295" y="208" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#059669">Yes</text>

  <!-- Decision 2 branches -->
  <path d="M 240,290 L 210,335" fill="none" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  <text x="202" y="315" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DC2626">No</text>

  <path d="M 135,275 L 135,435" fill="none" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
  <path d="M 190,385 L 190,435" fill="none" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>

  <!-- Validated Pass: From Decision 2 to Column 2 -->
  <path d="M 375,255 L 430,255 L 430,70 L 450,70" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="395" y="246" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#059669">Yes (Valid)</text>

  <!-- ==================== COLUMN 2: CANDIDATE MATCHING ==================== -->

  <!-- Step 1: Retrieve Qualified -->
  <g transform="translate(450, 45)" filter="url(#shadow)">
    <rect width="300" height="48" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="150" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">1. Query Faculty Roster</text>
    <text x="150" y="36" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Retrieve qualified peers &amp; same-section faculty</text>
  </g>

  <!-- Step 2: Exclude Busy -->
  <g transform="translate(450, 115)" filter="url(#shadow)">
    <rect width="300" height="48" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="150" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">2. Filter Conflicting Time Slots</text>
    <text x="150" y="36" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Exclude faculty teaching other classes at same hour</text>
  </g>

  <!-- Step 3: Priority Ranking -->
  <g transform="translate(450, 185)" filter="url(#shadow)">
    <rect width="300" height="52" rx="6" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.4"/>
    <text x="150" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#312E81" text-anchor="middle">3. Multi-Tier Priority Ranking</text>
    <text x="150" y="38" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4338CA" text-anchor="middle">P1 (Same Section) &gt; P2 (Course) &gt; P3 (Dept)</text>
  </g>

  <!-- Step 4: Create Request & Open -->
  <g transform="translate(450, 260)" filter="url(#shadow)">
    <rect width="300" height="48" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="150" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">4. Create Substitution Request</text>
    <text x="150" y="36" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Status = OPEN; Broadcast WebSocket invites</text>
  </g>

  <!-- Step 5: Highlight Yellow -->
  <g transform="translate(450, 330)" filter="url(#shadow)">
    <rect width="300" height="48" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="150" y="21" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#92400E" text-anchor="middle">Set Slot to YELLOW: [sub-pending]</text>
    <text x="150" y="36" font-family="Arial, sans-serif" font-size="10" fill="#B45309" text-anchor="middle">Live highlight visible across student/faculty views</text>
  </g>

  <!-- Decision 3: Response before deadline? -->
  <g transform="translate(500, 415)">
    <polygon points="100,0 200,40 100,80 0,40" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="100" y="34" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1C1917" text-anchor="middle">Peer response received</text>
    <text x="100" y="50" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1C1917" text-anchor="middle">before deadline?</text>
  </g>

  <!-- Column 2 Internal Arrows -->
  <line x1="600" y1="93" x2="600" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="163" x2="600" y2="185" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="237" x2="600" y2="260" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="308" x2="600" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="378" x2="600" y2="415" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== COLUMN 3: RESOLUTION & TIMELINE ==================== -->

  <!-- SUCCESS PATH (Top Right) -->
  
  <!-- Resolve Priority Diamond -->
  <g transform="translate(870, 75)">
    <polygon points="90,0 180,35 90,70 0,35" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="90" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">Highest Priority</text>
    <text x="90" y="46" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">Candidate Pool?</text>
  </g>

  <!-- Step: Assign Substitute -->
  <g transform="translate(845, 175)" filter="url(#shadow)">
    <rect width="345" height="48" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
    <text x="172" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">Update Status = ASSIGNED</text>
    <text x="172" y="36" font-family="Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Bind substitute instructor; award load credits</text>
  </g>

  <!-- Step: Penalty Ledger -->
  <g transform="translate(845, 245)" filter="url(#shadow)">
    <rect width="345" height="48" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="172" y="21" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">Record Penalties / Re-balance</text>
    <text x="172" y="36" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Log penalty debits for unexcused rejections</text>
  </g>

  <!-- Step: Highlight Green -->
  <g transform="translate(845, 315)" filter="url(#shadow)">
    <rect width="345" height="48" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
    <text x="172" y="21" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#065F46" text-anchor="middle">Set Slot to GREEN: [sub-assigned]</text>
    <text x="172" y="36" font-family="Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Live calendar displays substitute teacher's name</text>
  </g>

  <!-- End: Success Capsule -->
  <g transform="translate(875, 385)" filter="url(#shadow)">
    <rect width="285" height="40" rx="20" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/>
    <text x="142" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">End: Substitution Active</text>
  </g>

  <!-- Success Arrows -->
  <path d="M 700,455 L 770,455 L 770,110 L 870,110" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="778" y="260" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#059669" transform="rotate(90, 778, 260)" text-anchor="middle">Candidate Accepts</text>

  <line x1="960" y1="145" x2="960" y2="175" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="965" y="162" font-family="Arial, sans-serif" font-size="9.5" fill="#059669">Winner</text>

  <line x1="1017" y1="223" x2="1017" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1017" y1="293" x2="1017" y2="315" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1017" y1="363" x2="1017" y2="385" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- TIMEOUT / UNFILLED PATH (Bottom Right) -->

  <!-- Step: Expired / Unfilled -->
  <g transform="translate(845, 485)" filter="url(#shadow)">
    <rect width="345" height="46" rx="6" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.4"/>
    <text x="172" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9F1239" text-anchor="middle">Update Status = EXPIRED / UNFILLED</text>
    <text x="172" y="34" font-family="Arial, sans-serif" font-size="10" fill="#BE123C" text-anchor="middle">Deadline passed (Lecture Start + 10 min); no peer accepted</text>
  </g>

  <!-- Step: Highlight Red -->
  <g transform="translate(845, 550)" filter="url(#shadow)">
    <rect width="345" height="46" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.8"/>
    <text x="172" y="20" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9F1239" text-anchor="middle">Set Slot to RED: [sub-expired]</text>
    <text x="172" y="34" font-family="Arial, sans-serif" font-size="10" fill="#BE123C" text-anchor="middle">Live calendar displays 'Free Period' for student section</text>
  </g>

  <!-- End: Free Period Capsule -->
  <g transform="translate(900, 610)" filter="url(#shadow)">
    <rect width="235" height="36" rx="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6"/>
    <text x="117" y="23" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#991B1B" text-anchor="middle">End: Free Period</text>
  </g>

  <!-- Timeout Arrows -->
  <path d="M 600,495 L 600,508 L 845,508" fill="none" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="705" y="498" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DC2626">Deadline Passed (Start + 10 min)</text>

  <line x1="1017" y1="531" x2="1017" y2="550" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  <line x1="1017" y1="596" x2="1017" y2="610" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>

</svg>
